<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F4F1EA"/>
  <!-- Floor line -->
  <line x1="0" y1="460" x2="800" y2="460" stroke="#D8C8B5" stroke-width="2"/>
  <rect x="0" y="460" width="800" height="140" fill="#E8E2D6"/>
  <!-- Minimalist Wall Sconces -->
  <circle cx="220" cy="180" r="16" fill="#F6F3ED" stroke="#A58B70" stroke-width="2"/>
  <circle cx="580" cy="180" r="16" fill="#F6F3ED" stroke="#A58B70" stroke-width="2"/>
  <!-- Platform Bedframe & Headboard -->
  <g transform="translate(180, 240)">
    <!-- Base Shadow -->
    <ellipse cx="220" cy="225" rx="240" ry="20" fill="#292824" fill-opacity="0.08"/>
    <!-- Headboard (Upholstered Raw Linen) -->
    <rect x="20" y="20" width="400" height="130" rx="4" fill="#EDE7DC" stroke="#D8C8B5" stroke-width="1.5"/>
    <line x1="220" y1="20" x2="220" y2="150" stroke="#D8C8B5" stroke-width="1"/>
    <!-- Pillows -->
    <rect x="60" y="90" width="130" height="45" rx="5" fill="#FAF9F6" stroke="#D8C8B5" stroke-width="1"/>
    <rect x="250" y="90" width="130" height="45" rx="5" fill="#FAF9F6" stroke="#D8C8B5" stroke-width="1"/>
    <!-- Mattress & Linen Quilt -->
    <rect x="10" y="130" width="420" height="85" rx="4" fill="#F7F5EE" stroke="#D8C8B5" stroke-width="1.5"/>
    <!-- Folded Quilt / Throw Accent (Forest) -->
    <path d="M10 170 L430 170 L430 215 L10 215 Z" fill="#35483D" fill-opacity="0.12"/>
    <!-- Oak Platform Plinth -->
    <rect x="0" y="212" width="440" height="14" rx="2" fill="#A58B70"/>
  </g>
</svg>
