<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F4F1EA"/>
  <!-- Floor line -->
  <line x1="0" y1="460" x2="800" y2="460" stroke="#D8C8B5" stroke-width="2"/>
  <rect x="0" y="460" width="800" height="140" fill="#E8E2D6"/>
  <!-- Slatted Architectural Wall Shelf -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="180" height="8" rx="2" fill="#A58B70"/>
    <rect x="0" y="60" width="180" height="8" rx="2" fill="#A58B70"/>
    <rect x="25" y="-30" width="18" height="30" fill="#35483D"/>
    <rect x="47" y="-24" width="14" height="24" fill="#D8C8B5"/>
    <circle cx="120" cy="-14" r="14" fill="#EDE9DF" stroke="#A58B70" stroke-width="1.5"/>
  </g>
  <!-- Minimalist Executive Desk & Sculptural Chair -->
  <g transform="translate(160, 270)">
    <!-- Base Shadow -->
    <ellipse cx="240" cy="195" rx="230" ry="16" fill="#292824" fill-opacity="0.08"/>
    <!-- Minimal Desk Top (American Walnut) -->
    <rect x="20" y="80" width="440" height="24" rx="3" fill="#6B543D" stroke="#523F2C" stroke-width="1"/>
    <!-- Desk Drawer Box on Right -->
    <rect x="340" y="104" width="110" height="70" rx="2" fill="#7A6046" stroke="#523F2C" stroke-width="1"/>
    <line x1="375" y1="135" x2="415" y2="135" stroke="#C5A059" stroke-width="2"/>
    <!-- Trestle Legs on Left -->
    <line x1="45" y1="104" x2="35" y2="195" stroke="#292824" stroke-width="4"/>
    <line x1="85" y1="104" x2="95" y2="195" stroke="#292824" stroke-width="4"/>
    <line x1="340" y1="174" x2="340" y2="195" stroke="#292824" stroke-width="4"/>
    <line x1="440" y1="174" x2="440" y2="195" stroke="#292824" stroke-width="4"/>
    <!-- Sculptural Studio Task Chair -->
    <g transform="translate(170, 70)">
      <path d="M15 85 L15 35 Q15 15 50 15 Q85 15 85 35 L85 85" stroke="#35483D" stroke-width="3" fill="none"/>
      <rect x="20" y="60" width="60" height="12" rx="3" fill="#35483D"/>
      <line x1="50" y1="72" x2="50" y2="120" stroke="#292824" stroke-width="4"/>
      <line x1="25" y1="120" x2="75" y2="120" stroke="#292824" stroke-width="3"/>
    </g>
  </g>
</svg>
