<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F6F3ED"/>
  <!-- Floor line -->
  <line x1="0" y1="460" x2="800" y2="460" stroke="#D8C8B5" stroke-width="2"/>
  <rect x="0" y="460" width="800" height="140" fill="#EDE9DF"/>
  <!-- Hanging Ceiling Pendant Light -->
  <line x1="400" y1="0" x2="400" y2="160" stroke="#292824" stroke-width="2"/>
  <path d="M330 200 C330 160 470 160 470 200 Z" fill="#F6F3ED" stroke="#292824" stroke-width="2"/>
  <ellipse cx="400" cy="200" rx="70" ry="12" fill="#FAF9F6" stroke="#292824" stroke-width="1.5"/>
  <!-- Solid Oak Dining Table & Chairs -->
  <g transform="translate(180, 270)">
    <!-- Base Shadow -->
    <ellipse cx="220" cy="195" rx="230" ry="18" fill="#292824" fill-opacity="0.08"/>
    <!-- Back Chairs -->
    <g transform="translate(60, 40)">
      <path d="M10 90 L10 20 Q35 10 60 20 L60 90" stroke="#A58B70" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(320, 40)">
      <path d="M10 90 L10 20 Q35 10 60 20 L60 90" stroke="#A58B70" stroke-width="3" fill="none"/>
    </g>
    <!-- Table Top -->
    <rect x="0" y="115" width="440" height="22" rx="4" fill="#A58B70" stroke="#8C7355" stroke-width="1"/>
    <!-- Table Tapered Legs -->
    <line x1="45" y1="137" x2="35" y2="195" stroke="#8C7355" stroke-width="6" stroke-linecap="round"/>
    <line x1="395" y1="137" x2="405" y2="195" stroke="#8C7355" stroke-width="6" stroke-linecap="round"/>
    <!-- Foreground Chairs -->
    <g transform="translate(140, 90)">
      <rect x="15" y="55" width="55" height="10" rx="2" fill="#EAE5DC" stroke="#A58B70" stroke-width="1.5"/>
      <line x1="20" y1="65" x2="16" y2="105" stroke="#A58B70" stroke-width="3"/>
      <line x1="65" y1="65" x2="69" y2="105" stroke="#A58B70" stroke-width="3"/>
    </g>
    <g transform="translate(240, 90)">
      <rect x="15" y="55" width="55" height="10" rx="2" fill="#EAE5DC" stroke="#A58B70" stroke-width="1.5"/>
      <line x1="20" y1="65" x2="16" y2="105" stroke="#A58B70" stroke-width="3"/>
      <line x1="65" y1="65" x2="69" y2="105" stroke="#A58B70" stroke-width="3"/>
    </g>
  </g>
</svg>
